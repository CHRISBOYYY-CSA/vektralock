version: '3.8'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: securevault
      POSTGRES_DB: securevault
    ports:
      - "5432:5432"
    volumes:
      - securevault_pgdata:/var/lib/postgresql/data

volumes:
  securevault_pgdata:
